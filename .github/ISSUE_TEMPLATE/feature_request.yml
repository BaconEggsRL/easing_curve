```yaml
name: Feature Request
description: Suggest a new feature or improvement for Easing Curve.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Feature ideas and improvements are welcome.

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What would you like to see added or changed?
      placeholder: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What problem would this solve, or how would it improve the plugin?
      placeholder: Explain when or why this would be useful.
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed Behavior
      description: If you have a specific implementation or UX in mind, describe it here.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add mockups, screenshots, examples, links, or related information.
```
