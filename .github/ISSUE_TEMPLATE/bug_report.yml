```yaml
name: Bug Report
description: Report a problem with the Easing Curve plugin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide enough information to reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: Describe the issue clearly and concisely.
    validations:
      required: true

  - type: input
    id: godot_version
    attributes:
      label: Godot Version
      placeholder: "Example: 4.6.1"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Easing Curve Version
      placeholder: "Example: 1.0.5"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating System
      placeholder: "Example: Windows 11"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Create an EasingCurve resource
        2. Select ...
        3. Change ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Errors / Console Output
      description: Paste any relevant Godot errors, warnings, stack traces, or console output.
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add screenshots, videos, sample projects, or any other information that may help.
```
