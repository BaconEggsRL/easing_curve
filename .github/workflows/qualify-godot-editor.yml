name: Qualify patched Godot editor
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage-candidate:
    runs-on: windows-latest
    # GitHub requires write access to see unpublished draft releases. Only this
    # acquisition job has it; the two engine qualification jobs remain read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read unpublished candidate staging
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pin = Get-Content tooling/godot/editor-pin.json -Raw | ConvertFrom-Json
          gh release download $pin.candidate_tag --repo "$env:GITHUB_REPOSITORY" --pattern $pin.candidate_asset --dir test/_temp/candidate-download
          if ($LASTEXITCODE -ne 0) { throw 'Candidate staging download failed.' }
          . ./test/runners/godot_process_contract.ps1
          $archive = Join-Path test/_temp/candidate-download $pin.candidate_asset
          Assert-GodotExecutableHash $archive $pin.candidate_archive_sha256
          Expand-Archive $archive test/_temp/candidate
          Assert-GodotExecutableHash test/_temp/candidate/godot-editor.exe $pin.editor_sha256
      - uses: actions/upload-artifact@v4
        with:
          name: unpublished-godot-candidate
          compression-level: 0
          path: test/_temp/candidate-download/*
  qualify:
    needs: stage-candidate
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read Godot tooling manifest
        id: godot-tooling
        shell: pwsh
        run: ./tooling/godot/read_manifest.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.godot-tooling.outputs.python_version }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot-tooling.outputs.official_version }}
          use-dotnet: false
          include-templates: true
      - name: Download verified historical archive
        shell: pwsh
        run: ./tooling/godot/download_historical_archive.ps1
      - uses: actions/download-artifact@v4
        with:
          name: unpublished-godot-candidate
          path: test/_temp/candidate-download
      - name: Obtain unpublished candidate bytes and capture tool
        shell: pwsh
        run: |
          $pin = Get-Content tooling/godot/editor-pin.json -Raw | ConvertFrom-Json
          . ./test/runners/godot_process_contract.ps1
          $candidateArchive = Join-Path test/_temp/candidate-download $pin.candidate_asset
          Assert-GodotExecutableHash $candidateArchive $pin.candidate_archive_sha256
          Expand-Archive $candidateArchive test/_temp/candidate
          Assert-GodotExecutableHash test/_temp/candidate/godot-editor.exe $pin.editor_sha256
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile test/_temp/procdump.zip
          Expand-Archive test/_temp/procdump.zip test/_temp/procdump
          $signature = Get-AuthenticodeSignature test/_temp/procdump/procdump64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'Invalid ProcDump signature.' }
          Assert-GodotExecutableHash $env:HISTORICAL_ARCHIVE $pin.historical_archive.sha256
          Expand-Archive $env:HISTORICAL_ARCHIVE test/_temp/release-input
          Copy-Item test/_temp/release-input/addons/easing_curve/bin/* addons/easing_curve/bin -Force
          $official = Join-Path $env:RUNNER_TEMP 'official-godot.exe'
          Copy-Item (Get-Command godot).Source $official
          "OFFICIAL_GODOT=$official" >> $env:GITHUB_ENV
      - name: Qualify exact candidate with strict runners
        shell: pwsh
        run: |
          $qualificationArgs = @{CandidateDirectory='test/_temp/candidate'; ArchivePath=$env:HISTORICAL_ARCHIVE; ProcDumpPath=(Resolve-Path test/_temp/procdump/procdump64.exe).Path; OfficialGodotPath=$env:OFFICIAL_GODOT}
          if ('${{ matrix.runner }}' -eq '1') { $qualificationArgs.FullSuite = $true }
          ./tooling/godot/qualify_candidate.ps1 @qualificationArgs
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-editor-qualification-${{ matrix.runner }}
          include-hidden-files: true
          compression-level: 7
          path: |
            test/_temp/editor-qualification/**/*.json
            test/_temp/editor-qualification/**/*.txt
            test/_temp/editor-qualification/**/*.log
            test/_temp/editor-qualification/**/*.dmp
            test/_temp/editor-qualification/docs/**
            test/_temp/runner/**/*.txt
            test/_temp/runner/**/*.log
            test/_temp/release-archive-*/test/_temp/*
            test/_temp/native-release-export/**/test/_temp/*
            test/_temp/native-web-export/**/test/_temp/*
            tooling/godot/editor-pin.json
