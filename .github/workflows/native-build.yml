name: Native builds

on:
  push:
    branches: [master, dev, native-v2-spike]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: Build supported Windows release library
        shell: pwsh
        run: ./native/build_native.ps1 -Platform windows -Target template_release
      - name: Validate Windows manifest contract
        shell: pwsh
        run: ./native/validate_native_manifest.ps1 -Platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin/*windows*.dll

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - uses: emscripten-core/setup-emsdk@v14
        with:
          version: 3.1.62
      - name: Build Web debug and release
        shell: pwsh
        run: ./native/build_native.ps1 -Platform web -Target all
      - name: Validate non-threaded Web manifest contract
        shell: pwsh
        run: ./native/validate_native_manifest.ps1 -Platform web
      - uses: actions/upload-artifact@v4
        with:
          name: easing-curve-native-web-wasm32
          path: addons/easing_curve/bin/*web*.nothreads.wasm

  windows-tests:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Godot tooling manifest
        id: godot-tooling
        shell: pwsh
        run: ./tooling/godot/read_manifest.ps1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot-tooling.outputs.official_version }}
          use-dotnet: false
          include-templates: true
      - name: Install qualified editor for editor invocation roles
        shell: pwsh
        run: ./tooling/godot/install_editor.ps1
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin
      - name: Run all Windows test suites against the release library
        shell: pwsh
        run: |
          $godotCommand = (Get-Command godot -ErrorAction Stop).Source
          $godotExe = Join-Path $env:RUNNER_TEMP "easing-curve-godot.exe"
          Copy-Item -LiteralPath $godotCommand -Destination $godotExe -Force
          if (-not (Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable copy was not created: $godotExe"
          }
          . ./test/runners/godot_process_contract.ps1
          Get-GodotVersion -ExecutablePath $godotExe -LogPath "$env:GITHUB_WORKSPACE/test/_temp/official-version.log"
          ./test/runners/godot_process_contract_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Godot process contract tests failed." }
          ./test/runners/runner_hardening_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Runner hardening tests failed." }
          ./tooling/godot/tooling_contract_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Tooling contract tests failed." }
          ./test/runners/run_all_tests.ps1 --run -GodotPath $godotExe
          if ($LASTEXITCODE -ne 0) { throw "Windows correctness suites failed." }
          ./test/runners/run_native_release_export_test.ps1 -SkipBuild -GodotPath $godotExe
          if ($LASTEXITCODE -ne 0) { throw "Windows release export validation failed." }
      - name: Preserve editor tooling provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-editor-provenance
          include-hidden-files: true
          path: .cache/godot/pinned-editor/*.json
      - name: Preserve Windows test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easing-curve-windows-test-diagnostics
          if-no-files-found: ignore
          path: |
            test/_temp/runner/**/stdout.txt
            test/_temp/runner/**/stderr.txt
            test/_temp/runner/**/godot.log
            test/_temp/runner/**/exitcode.txt

  web-runtime:
    needs: [windows, windows-tests, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Godot tooling manifest
        id: godot-tooling
        shell: pwsh
        run: ./tooling/godot/read_manifest.ps1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot-tooling.outputs.official_version }}
          use-dotnet: false
          include-templates: true
      - name: Install qualified editor for editor invocation roles
        shell: pwsh
        run: ./tooling/godot/install_editor.ps1
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-web-wasm32
          path: addons/easing_curve/bin
      - name: Export and run Native Web debug and release fixtures
        shell: pwsh
        run: |
          $godotCommand = (Get-Command godot -ErrorAction Stop).Source
          $godotExe = Join-Path $env:RUNNER_TEMP "easing-curve-godot.exe"
          Copy-Item -LiteralPath $godotCommand -Destination $godotExe -Force
          if (-not (Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable copy was not created: $godotExe"
          }
          . ./test/runners/godot_process_contract.ps1
          Get-GodotVersion -ExecutablePath $godotExe -LogPath "$env:GITHUB_WORKSPACE/test/_temp/official-version.log"
          ./test/runners/run_native_web_export_test.ps1 -SkipBuild -GodotPath $godotExe
          if ($LASTEXITCODE -ne 0) { throw "Native Web validation failed." }
      - name: Preserve editor tooling provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-editor-provenance
          include-hidden-files: true
          path: .cache/godot/pinned-editor/*.json

  package:
    needs: [windows-tests, web-runtime]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read Godot tooling manifest
        id: godot-tooling
        shell: pwsh
        run: ./tooling/godot/read_manifest.ps1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot-tooling.outputs.official_version }}
          use-dotnet: false
      - name: Install qualified editor for editor invocation roles
        shell: pwsh
        run: ./tooling/godot/install_editor.ps1
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-web-wasm32
          path: addons/easing_curve/bin
      - name: Build and validate the exact dual-API archive
        shell: pwsh
        run: |
          $godotCommand = (Get-Command godot -ErrorAction Stop).Source
          $godotExe = Join-Path $env:RUNNER_TEMP "easing-curve-godot.exe"
          Copy-Item -LiteralPath $godotCommand -Destination $godotExe -Force
          . ./test/runners/godot_process_contract.ps1
          Get-GodotVersion -ExecutablePath $godotExe -LogPath "$env:GITHUB_WORKSPACE/test/_temp/official-version.log"
          ./build_asset_store.ps1
          if ($LASTEXITCODE -ne 0) { throw "Archive build failed." }
          ./test/runners/release_archive_diagnostics_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Archive diagnostic contract failed." }
          ./test/runners/run_release_archive_test.ps1 -GodotPath $godotExe
          if ($LASTEXITCODE -ne 0) { throw "Exact archive validation failed." }
      - name: Preserve editor tooling provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-editor-provenance
          include-hidden-files: true
          path: .cache/godot/pinned-editor/*.json
      - name: Record package Windows crash events
        if: failure()
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            Id = 1000, 1001
            StartTime = (Get-Date).AddMinutes(-30)
          } -ErrorAction SilentlyContinue | Where-Object { $_.Message -like '*easing-curve-godot*' }
          New-Item -ItemType Directory -Force -Path test/_temp | Out-Null
          $events | Format-List TimeCreated, Id, Message | Out-String |
            Set-Content -LiteralPath test/_temp/package-windows-crashes.txt
      - name: Preserve exact archive failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easing-curve-package-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            test/_temp/package-windows-crashes.txt
            test/_temp/release-archive-*/test/_temp/*.log
            test/_temp/release-archive-*/test/_temp/*.txt
            test/_temp/release-archive-*/test/_temp/*.json
            test/_temp/release-archive-*/.godot/global_script_class_cache.cfg
            test/_temp/release-archive-*/.godot/imported/**
            test/_temp/release-archive-*/addons/easing_curve/**
            _exports/_asset_store_builds/easing_curve_v*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: easing-curve-dual-api-package
          path: _exports/_asset_store_builds/easing_curve_v*.zip
