name: Native builds

on:
  push:
    branches: [master, dev, native-v2-spike]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: Build supported Windows release library
        shell: pwsh
        run: ./native/build_native.ps1 -Platform windows -Target template_release
      - name: Validate Windows manifest contract
        shell: pwsh
        run: ./native/validate_native_manifest.ps1 -Platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin/*windows*.dll

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - uses: emscripten-core/setup-emsdk@v14
        with:
          version: 3.1.62
      - name: Build Web debug and release
        shell: pwsh
        run: ./native/build_native.ps1 -Platform web -Target all
      - name: Validate non-threaded Web manifest contract
        shell: pwsh
        run: ./native/validate_native_manifest.ps1 -Platform web
      - uses: actions/upload-artifact@v4
        with:
          name: easing-curve-native-web-wasm32
          path: addons/easing_curve/bin/*web*.nothreads.wasm

  windows-tests:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin
      - name: Run all Windows test suites against the release library
        shell: pwsh
        run: |
          $godotCommand = (Get-Command godot -ErrorAction Stop).Source
          $godotExe = Join-Path $env:RUNNER_TEMP "easing-curve-godot.exe"
          Copy-Item -LiteralPath $godotCommand -Destination $godotExe -Force
          if (-not (Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable copy was not created: $godotExe"
          }
          $versionProcess = Start-Process -FilePath $godotExe -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) {
            throw "Copied Godot executable validation failed with exit code $($versionProcess.ExitCode)."
          }
          ./test/runners/run_all_tests.ps1 --run -GodotPath $godotExe
      - name: Preserve Windows test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easing-curve-windows-test-diagnostics
          if-no-files-found: ignore
          path: |
            test/_temp/runner/**/stdout.txt
            test/_temp/runner/**/stderr.txt
            test/_temp/runner/**/godot.log
            test/_temp/runner/**/exitcode.txt

  web-runtime:
    needs: [windows, windows-tests, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-web-wasm32
          path: addons/easing_curve/bin
      - name: Export and run Native Web debug and release fixtures
        shell: pwsh
        run: |
          $godotCommand = (Get-Command godot -ErrorAction Stop).Source
          $godotExe = Join-Path $env:RUNNER_TEMP "easing-curve-godot.exe"
          Copy-Item -LiteralPath $godotCommand -Destination $godotExe -Force
          if (-not (Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable copy was not created: $godotExe"
          }
          $versionProcess = Start-Process -FilePath $godotExe -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) {
            throw "Copied Godot executable validation failed with exit code $($versionProcess.ExitCode)."
          }
          ./test/runners/run_native_web_export_test.ps1 -SkipBuild -GodotPath $godotExe

  package:
    needs: [windows-tests, web-runtime]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-windows-x86_64
          path: addons/easing_curve/bin
      - uses: actions/download-artifact@v4
        with:
          name: easing-curve-native-web-wasm32
          path: addons/easing_curve/bin
      - name: Build and validate the exact dual-API archive
        shell: pwsh
        run: |
          $godotCommand = (Get-Command godot -ErrorAction Stop).Source
          $godotExe = Join-Path $env:RUNNER_TEMP "easing-curve-godot.exe"
          Copy-Item -LiteralPath $godotCommand -Destination $godotExe -Force
          $versionProcess = Start-Process -FilePath $godotExe -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) {
            throw "Copied Godot executable validation failed with exit code $($versionProcess.ExitCode)."
          }
          ./build_asset_store.ps1
          ./test/runners/run_release_archive_test.ps1 -GodotPath $godotExe
      - uses: actions/upload-artifact@v4
        with:
          name: easing-curve-dual-api-package
          path: _exports/_asset_store_builds/easing_curve_v*.zip
